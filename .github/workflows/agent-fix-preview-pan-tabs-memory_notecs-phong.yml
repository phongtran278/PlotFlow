name: Build and deploy Vite app to Azure Web App - notecs-phong

on:
  push:
    branches:
      - agent/fix-preview-pan-tabs-memory
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install and build
        working-directory: ./app
        run: |
          npm install
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ./app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EDDC3C92FA2B4A4686C5C87E32FD93C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0692DB7A50F44317A3644D63BB6FF8AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8F3C842077DA46479FEAA5DCDD163A39 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'notecs-phong'
          slot-name: 'Production'
          package: .
