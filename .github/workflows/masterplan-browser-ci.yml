name: PlotFlow masterplan and browser regression
on:
  pull_request:
    branches:
      - qa/backup-recovery-20261125
      - qa/masterplan-browser-20261125
      - qa/detail-raster-lifecycle-20261125
      - qa/shared-sales-core-20261125
      - qa/project-cloud-scope-20261125
      - qa/project-workspace-boundary-20261125
      - fix/masterplan-tl-index-on-qa-20261127
    paths:
      - 'app/**'
      - '.github/workflows/masterplan-browser-ci.yml'
permissions:
  contents: read
jobs:
  media:
    # Playwright 1.58.2 supports Ubuntu 24.04, not the current ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Reproduce committed security dependency installation
        run: npm ci
      - name: Dependency audit (release gate evaluated after tests)
        run: |
          set +e
          npm audit --json > dependency-audit.json
          full_status=$?
          npm audit --omit=dev --json > dependency-audit-runtime.json
          runtime_status=$?
          set -e
          echo "npm audit exits: full=$full_status runtime=$runtime_status"
          node --input-type=module -e 'import fs from "node:fs"; for (const f of ["dependency-audit.json","dependency-audit-runtime.json"]) { const j=JSON.parse(fs.readFileSync(f)); if (!j.metadata?.vulnerabilities) throw Error("Audit unavailable: "+f); console.log(f, JSON.stringify(j.metadata.vulnerabilities)); for(const [name,v] of Object.entries(j.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via||[]).filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,severity:x.severity,range:x.range}))})); }'
      - run: npm run check:secrets
      - run: npm test
      - name: Verify Excel import and export compatibility
        run: node --test tools/tests/excel-security.test.mjs
      - name: Test isolated image fixtures
        run: node --test tools/tests/media-preview.test.mjs
      - name: Build UI with default strict asset guard and no live State API or Azure credentials
        env:
          VITE_PROJECT_STATE_URL: ''
          VITE_STATE_API_BASE_URL: ''
        run: npm run build
      - name: Verify build shell
        run: npm run test:build
      - name: Verify no images missing or omitted
        run: |
          node --input-type=module -e 'import fs from "node:fs";const a=JSON.parse(fs.readFileSync("asset-audit-report.json"));const o=JSON.parse(fs.readFileSync("dist/staging-omitted-assets.json"));const m=JSON.parse(fs.readFileSync("media-optimization-report.json"));if(!a.total||a.missingCount||a.oversizeCount||o.omitted.length||m.failed.length)throw Error("Incomplete media build");console.log(JSON.stringify({sourceImages:a.total,optimized:m.optimized,bytesBefore:m.bytesBefore,bytesAfter:m.bytesAfter,missing:a.missingCount,oversize:a.oversizeCount,omitted:o.omitted.length}));'
      - name: Test local media plan
        run: node --test tools/tests/media-plan.test.mjs
      - name: Create local project manifest (no Azure access)
        run: |
          node tools/plan-project-media.mjs vinhomes-saigon-park > media-sync-plan.json
          node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("media-sync-plan.json"));if(p.publicationAllowed||!p.sourceCount)throw Error("Unexpected plan");console.log(JSON.stringify({projectId:p.projectId,sourceCount:p.sourceCount,runtimeCount:p.runtimeCount,objects:p.objects.length,unverifiedProvenance:p.unverifiedProvenance,remoteState:p.remoteState}));'
      - name: Test synthetic tile rendering
        run: node --test tools/tests/masterplan-tiles.test.mjs
      - name: Audit built PDF and page pyramid
        run: node tools/audit-masterplan-build.mjs
      - name: Test Auto Lot Shape against real Masterplan parcels
        run: node tools/test-auto-lot-shape-masterplan.mjs
      - name: Install isolated browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/plotflow-browser"
          npm install --prefix "$RUNNER_TEMP/plotflow-browser" --no-audit --no-fund --save-exact playwright@1.58.2
          "$RUNNER_TEMP/plotflow-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser raster and navigation regression
        env:
          VITE_PROJECT_STATE_URL: ''
          VITE_STATE_API_BASE_URL: ''
        run: |
          export PLOTFLOW_PLAYWRIGHT_MODULE="$RUNNER_TEMP/plotflow-browser/node_modules/playwright/index.mjs"
          node tools/browser-smoke-memory.mjs
      - name: Detail raster and cancellation regression
        env:
          VITE_PROJECT_STATE_URL: ''
          VITE_STATE_API_BASE_URL: ''
        run: |
          export PLOTFLOW_PLAYWRIGHT_MODULE="$RUNNER_TEMP/plotflow-browser/node_modules/playwright/index.mjs"
          node tools/browser-detail-raster.mjs
      - name: Security release gate
        run: |
          node --input-type=module -e 'import fs from "node:fs";for(const f of ["dependency-audit.json","dependency-audit-runtime.json"]){const v=JSON.parse(fs.readFileSync(f)).metadata?.vulnerabilities;if(!v||v.high||v.critical)throw Error("Unresolved high/critical findings: "+f);}'
      - name: Save QA reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: masterplan-browser-qa
          path: |
            app/package.json
            app/package-lock.json
            app/masterplan-audit-report.json
            app/auto-lot-shape-masterplan-report.json
            app/browser-check-output/browser-smoke-memory.json
            app/browser-check-output/detail-raster.json
            app/media-sync-plan.json
            app/media-optimization-report.json
            app/asset-audit-report.json
            app/dependency-audit.json
            app/dependency-audit-runtime.json
          retention-days: 7
