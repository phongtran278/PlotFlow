name: PlotFlow CI

on:
  push:
    branches:
      - main
      - agent/fix-preview-pan-tabs-memory
  pull_request:
    branches:
      - main
      - agent/fix-preview-pan-tabs-memory

permissions:
  contents: read

concurrency:
  group: plotflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check accidentally committed storage secrets
        run: npm run check:secrets

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify built app shell
        run: npm run test:build
