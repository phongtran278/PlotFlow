name: Deploy PlotFlow to Azure Storage

on:
  push:
    branches:
      - agent/fix-preview-pan-tabs-memory
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build PlotFlow code only
        working-directory: ./app
        env:
          PLOTFLOW_CODE_ONLY_DEPLOY: '1'
        run: npx vite build

      - name: Verify build output
        run: |
          test -f ./app/dist/index.html
          test -d ./app/dist/assets

      - name: Upload app shell to Azure $web
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name '$web' \
            --file ./app/dist/index.html \
            --name index.html \
            --overwrite true

          find ./app/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | while IFS= read -r -d '' file; do
            blob="${file#./app/dist/}"
            az storage blob upload \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --container-name '$web' \
              --file "$file" \
              --name "$blob" \
              --overwrite true \
              --only-show-errors
          done

      - name: Verify Azure app shell
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob exists \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --container-name '$web' \
            --name index.html \
            --query exists \
            --output tsv | grep -qx true
